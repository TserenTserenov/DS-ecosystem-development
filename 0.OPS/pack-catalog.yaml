# SoT: этот файл. Потребителю доставляется копией при подключении (открытая витрина — фаза сервиса).
# Правило выдачи: наружу идут только Pack (доменное знание, тип 2.3). DS-* и платформенные паки не выдаются.
schema_version: 1
updated: 2026-08-15
