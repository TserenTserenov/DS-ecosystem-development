# Не в каталоге (осознанно):
#   PACK-education — репозитория нет на GitHub (локальный черновик, не опубликован)
#   DS-* — личное/производное, границей выдачи служит само различение Base/Pack/DS
#
# offered: internal-only — новое значение (02.09.2026, по просьбе пилота «внести все мои паки»).
# /pack-subscribe сегодня не читает это поле как запрет — реальная защита у internal-only паков
# идёт ТОЛЬКО через access: by-subscription + фактическую приватность репо на GitHub (проверено
# 02.09: verification/autonomous-agents/agent-rules — PRIVATE, digital-platform — всё ещё PUBLIC,
# см. предупреждение в его записи выше). offered: internal-only — декларация назначения для
# человека и будущего Ф4-фильтра, не техническая защита сама по себе.
#
# DPF-SYSE/MEPF/MDPEF: connect отсутствуют capability — постоянная синхронизация, начисление баллов
# автору и доступ к закрытым томам Suite. Требуют ArchGate до дизайна (WP-532, зафиксировано 02.09.2026,
# см. inbox/WP-532/WP-532.md «Вход из пир-сессии с Codex 02.09.2026»). offered: on-demand — не default,
# чтобы не подразумевать готовую продуктовую функцию.
#
# Статус реального поиска через aisystant MCP (проверено живым запросом 02.09.2026):
#   DPF-MDPEF (Reference-документ Suite, 39К знаков) — ПРОИНДЕКСИРОВАН, ищется через knowledge_search
#   DPF-SYSE / DPF-MEPF / DPF-MDPEF (сами тексты паттернов, 600-800К знаков каждый) — НЕ проиндексированы,
#   knowledge_reindex_source молча пропускает файл такого размера (нет текста ошибки). Технический
#   предел не выяснен, требует отдельного расследования — см. WP-532 «Живой прогон» 02.09.2026.
