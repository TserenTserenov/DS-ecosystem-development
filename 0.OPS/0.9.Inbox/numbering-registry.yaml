gate_design:
  note: >
    Design v1 предлагал отдельный numbering-gate.sh (трёхветочный детектор A/B/C). Ревизия по методу:
    Case B (новый префикс не в реестре) = триггер `new_id_prefix_family` правила AR.234 (live, structural E2 через CI).
    Case A (штатный рост) — молчит by design. Реестр = ДАННЫЕ, которые консультирует AR.234; не дубль-gate.
  honest_coverage: >
    механизмом. AR.234 НЕ имеет триггера token_collision и lookup'а по этому реестру; его semantic-nudge (дизайн осей)
    ОТЛОЖЕН (E3, см. AR.234 §Активация). Валидатор numbering-registry.py ловит только ОБЪЯВЛЕННЫЕ коллизии (раздел
    collisions), а не новые write-time токены. Итог: Case A — live (молчит), Case B — live (AR.234 E2),
    Case C — open (только отложенный E3-semantic; token-collision детектор = backlog, см. coverage_gap_backlog).
  case_a: "новый entry в известном namespace (WP-419) → молчит [live]"
  case_b: "новый префикс не в реестре → AR.234 new_id_prefix_family review [live, E2]"
  case_c: "токен занят другим namespace → НЕ покрыт live; AR.234 semantic-nudge отложен [open, E3]"
  coverage_gap_backlog: "token-collision детектор (Case C live) — отдельная задача, идёт вместе с semantic agent-write nudge AR.234 (backlog WP-419 spin-off)."
location_decision:
  current: "0.OPS/0.9.Inbox (ко-локация с registry-catalog + его CI/drift-check; team canon)"
  rationale: "CI registry-catalog-validate.yml и drift-check живут в DS-ecosystem-development; большинство реестров управляются отсюда; 0.OPS = canonical для team-level реестров."
  migration_trigger: "Перенос в PACK-digital-platform — при расширении CI на cross-repo (тогда SoT по design v1). До тех пор 0.OPS canonical для team-уровня. Записано в backlog РП419."
