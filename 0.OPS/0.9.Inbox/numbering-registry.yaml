# --- §5 SELF-REGISTRATION (догфуд DP.METHOD.054: этот реестр сам = новая схема) ---
schema_registration:
  name: "Реестр нумераций IWE (ID-префикс-семейства)"
  owner: "Церен"
  bounded_context: "Пространства имён ID-префиксов кодов сущностей (Паки + governance). НЕ сами коды (это Pack), а namespace'ы как целое."
  axis_facet: "namespace ID-префикса; ось ортогональна registry-catalog (тот = реестры/списки). Взаимоисключающа: один префикс = одна строка."
  enforcement_mechanism: E1-hard      # валидатор numbering-registry.py падает на битой записи (путь чтения)
  enforcement_surface:
    covered_paths: ["validator-read (numbering-registry.py --validate)"]
    uncovered_paths: ["agent-write нового префикса (Case B/C gate — target, см. §gate_design)"]
    uncovered_is_nonstandard: false   # write-time prevention остаётся open (как у всей экосистемы, Ф2 SOTA)
  structural_check: E1-hard           # «префикс присутствует в реестре» — валидатор
  semantic_check: E3                  # «маппинг коллизии корректен» — экспертная оценка владельца

