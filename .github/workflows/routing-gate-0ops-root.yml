name: routing-gate-0ops-root
# Серверный гейт размещения (WP-73 needs-decision #3, ADR в 0.OPS/0.99.Archive/ADR-routing-gate-0ops-root.md).
# 0.OPS/* — мета-уровень (F0): операционная governance + транзит обсуждения,
# НЕ дом доменного знания и НЕ дом кросс-ядерной навигации (постоянные дома — Паки + ядра A/B/C).
# Блокирует новый .md-файл прямо в корне 0.OPS/ (не в подпапке 0.1-0.99).
# Канон: PACK-digital-platform/.../DP.KR.001-knowledge-routing.md §5.5.
on:
  pull_request:
    paths:
      - '0.OPS/*.md'
  push:
    branches: [main]
    paths:
      - '0.OPS/*.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bypass tag
        id: bypass
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if grep -qF '[routing-gate-bypass]' <<< "$MSG"; then
            echo "bypass=true" >> "$GITHUB_OUTPUT"
          else
            echo "bypass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect new files directly in 0.OPS root
        if: steps.bypass.outputs.bypass != 'true'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="$BASE_REF"
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null 2>&1; then
            BASE=$(git rev-parse --verify --quiet "HEAD~1" || git rev-parse HEAD)
          fi
          NEW_ROOT_FILES=$(git diff --diff-filter=AR --name-only "$BASE...HEAD" -- '0.OPS' | grep -E '^0\.OPS/[^/]+\.md$' || true)
          if [ -n "$NEW_ROOT_FILES" ]; then
            echo "🚫 Новый файл прямо в корне 0.OPS/ — не дом ни доменного знания, ни кросс-ядерной навигации:"
            printf '%s\n' "$NEW_ROOT_FILES" | sed 's/^/   /'
            echo ""
            echo "   Постоянные дома = Pack-репозитории + ядра A/B/C."
            echo "   Легитимный новый файл мета-уровня — добавь тег [routing-gate-bypass] в commit-сообщение."
            exit 1
          fi
          echo "✅ routing-gate: новых файлов прямо в корне 0.OPS/ не найдено"
