name: registry-catalog-validate
# E2-замок каталога реестров (WP-419, метод DP.METHOD.054 §8).
# Командный E2: ловит ВСЕХ коммитеров на push/PR (локальный git-хук ловил бы только установившего).
on:
  push:
    branches: [main]
    paths:
      - '0.OPS/0.9.Inbox/WP-419-registry-catalog-draft.yaml'
      - '0.OPS/scripts/registry-catalog.py'
      - '0.OPS/scripts/registry-catalog-drift-check.sh'
      - '**/*-catalog.yaml'        # новый реестр ГДЕ УГОДНО в этом репо (не только 0.OPS)
      - '**/*registry*.yaml'
      - '.github/workflows/registry-catalog-validate.yml'
  pull_request:
    paths:
      - '0.OPS/**'
      - '**/*-catalog.yaml'
      - '**/*registry*.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pyyaml
      - name: Catalog integrity (E1-hard — валидатор падает на битом каталоге)
        run: python3 0.OPS/scripts/registry-catalog.py --validate
      - name: New-registry drift guard (E2 — новый реестр без записи в каталоге)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash 0.OPS/scripts/registry-catalog-drift-check.sh
