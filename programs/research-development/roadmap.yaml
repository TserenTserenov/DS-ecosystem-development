  "формулировка гипотезы":
    - PD.METHOD.004
    - PD.METHOD.016
  "глубина методологии":
    - PD.METHOD.003
    - PD.METHOD.008
  "масштабирование исследования":
    - PD.METHOD.008
    - PD.METHOD.005

domains_applicable:
  - domain-knowledge-worker
  - domain-generic

applicability:
  required:
    - "Исследовательская деятельность с явной гипотезой или фронтиром"
  recommended:
    - "Квалификация ЛР ≥ ступени 3 (Систематический)"
  not_applicable:
    - "Только исполнительская работа → программа work-development"

transition_criteria:
  1_to_2:
    - "Сформулированы и проверены первые гипотезы"
  2_to_3:
    - "Создано оригинальное знание, признанное сообществом"
