program_id: RD
program_name: "Исследовательское Развитие"
applies_contract: "WP-371 v2"
content_repo: "docs/ru/research/"

stages:
  - level: 1
    name: "Наблюдатель"
    seed_lookup: "stage-2-practicing"
    narrative_phase: "Я исследую фронтир"
    typical_bottleneck: "формулировка гипотезы"
    rhythm: "5-8h/wk"

  - level: 2
    name: "Исследователь"
    seed_lookup: "stage-3-systematic"
    narrative_phase: "Я систематизирую знания"
    typical_bottleneck: "глубина методологии"
    rhythm: "8-12h/wk"

  - level: 3
    name: "Фронтир"
    seed_lookup: "stage-4-disciplined"
    narrative_phase: "Я создаю новое знание"
    typical_bottleneck: "масштабирование исследования"
    rhythm: "12-20h/wk"

  # Levels 4-7: for levels 5-7 seed_lookup is INACTIVE when DS-eco seed exists.
  # Renderer calls _try_eco_seed(research-development, level, domain) first (B2 source wire,
  # WP-149 Ф-rung-fidelity, peer-session 2026-06-23-02). If eco seed found → use it.
  # If NOT found AND level>=5 → missing_source (no stage-5-proactive fallback — that
  # would silently serve ЛР/ученик content). seed_lookup kept as documentation only.
  - level: 4
    name: "Лидер исследования"
    seed_lookup: "stage-5-proactive"
    narrative_phase: "Я веду исследовательскую повестку области"
    typical_bottleneck: "формирование исследовательской школы"
    rhythm: "20h+/wk"

  - level: 5
    name: "Мастер-исследователь"
    seed_lookup: "stage-5-proactive"
    narrative_phase: "Я задаю методологический стандарт"
    typical_bottleneck: "передача исследовательской культуры"
    rhythm: "20h+/wk"

  - level: 6
    name: "Реформатор"
    seed_lookup: "stage-5-proactive"
    narrative_phase: "Я реформирую методологию области"
    typical_bottleneck: "системное влияние на парадигму"
    rhythm: "20h+/wk"

  - level: 7
    name: "Революционер"
    seed_lookup: "stage-5-proactive"
    narrative_phase: "Я создаю новую научную парадигму"
    typical_bottleneck: "фронтирное влияние на цивилизацию"
    rhythm: "20h+/wk"

